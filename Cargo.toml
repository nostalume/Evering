[package]
name = "evering"
version = "0.2.0"
authors = ["Nostalgia <Nostalume@outlook.com>"]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.100.0"
description = "Typed shared-memory communication across processes"
repository = "https://github.com/nostalume/evering"
readme = "README.md"
publish = true
keywords = ["ipc", "shared-memory", "lock-free", "runtime"]
# `no-std` is the scope `docs/stability.md` records, not a claim about the whole surface: with default
# features off the byte, layout, storage, transport and notification-model layers stay, and every
# host-gated feature is simply absent rather than narrower. The category points at that section.
categories = ["concurrency", "data-structures", "no-std"]
include = [
    "/src/**", "/examples/**", "/tests/**", "/docs/**", "/Cargo.toml", "/Cargo.lock",
    "/README.md", "/LICENSE-*", "/rust-toolchain.toml",
]

# `tests/support.rs` is the harness the claim files import, not a target of its own, and the only way to
# keep discovery from turning it into one is to name every target here. The list is therefore a check: a
# claim file missing from it is built by nothing and reported by nobody.
#
# A claim whose legs are separate files lives in a directory named after its root, and the root reaches
# those legs with `#[path]`: a crate root looks for its children beside itself, so a bare `mod unix;` in
# `tests/foo.rs` would resolve to `tests/unix.rs` and land in the flat list the rows below are checked
# against.
autotests = false

[features]
default = ["std"]
std = []
# `nix/feature` names no capability of this crate's own: `src/os/unix.rs` asks the host for its page size
# through `nix::unistd::sysconf`, and nix keeps that call behind that feature. Nothing but a `map`-only build
# notices it missing, which is why the workflow has one on each arm.
map = ["std", "dep:nix", "nix/feature", "nix/fs", "nix/mman", "dep:windows-sys",
    "windows-sys/Win32_Foundation", "windows-sys/Win32_Security", "windows-sys/Win32_System_Memory"]
notify = ["std", "dep:nix", "nix/event", "nix/poll", "dep:windows-sys",
    "windows-sys/Win32_Foundation", "windows-sys/Win32_Security",
    "windows-sys/Win32_System_Threading"]
process = [
    "map", "notify", "nix/process", "nix/signal", "nix/socket", "nix/uio", "nix/user", "nix/poll",
    "windows-sys/Win32_Security", "windows-sys/Win32_System_IO",
    "windows-sys/Win32_Storage_FileSystem", "windows-sys/Win32_System_Pipes",
    "windows-sys/Win32_System_Threading",
]
os = ["map", "notify", "process"]
evidence = ["std", "dep:blake3", "dep:serde", "dep:serde_json"]
benchmark = ["evidence", "os", "tokio", "local-socket"]
local-socket = ["process", "tokio", "dep:tempfile"]
plot = ["benchmark", "dep:plotters"]
tokio = ["std", "notify", "dep:tokio"]
tracing = ["std", "dep:tracing"]

[dependencies]
bitflags = "2.10.0"
blake3 = { version = "1.8.2", optional = true }
crossbeam-utils = { version = "0.8", default-features = false }
serde = { version = "1.0.228", optional = true, features = ["derive"] }
serde_json = { version = "1.0.145", optional = true }
tokio = { version = "1.47.1", optional = true, default-features = false, features = ["net", "rt", "sync", "time"] }
tracing = { version = "0.1", optional = true }
plotters = { version = "0.3.7", optional = true, default-features = false, features = ["svg_backend"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30.1", optional = true, default-features = false }
tempfile = { version = "3.20.0", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", optional = true, default-features = false }

[dev-dependencies]
fastrand = "2.3.0"
hdrhistogram = "7.5.4"
socket2 = "0.6.1"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bench]]
name = "ipc"
path = "benches/ipc/main.rs"
harness = false
test = false
required-features = ["benchmark"]

[[test]]
name = "backend_adapters"
path = "tests/backend_adapters.rs"
# No `required-features`, as for `verification_layout`: this target reads `src/tests` as text and imports no
# production code, so there is no feature that could make it fail to build — including the `map` gate that
# keeps the unix tree from compiling here at all.

[[test]]
name = "child_supervision"
path = "tests/child_supervision.rs"
required-features = ["process"]

[[test]]
name = "example_wire"
path = "tests/example_wire.rs"
required-features = ["os", "tokio"]

[[test]]
name = "handover_admission"
path = "tests/handover_admission.rs"
required-features = ["process"]

[[test]]
name = "handover_attestation"
path = "tests/handover_attestation.rs"
required-features = ["os"]

[[test]]
name = "notification_latch"
path = "tests/notification_latch.rs"
required-features = ["notify", "tokio"]

[[test]]
name = "portable_contracts"
path = "tests/portable_contracts.rs"
required-features = ["map"]

[[test]]
name = "protocol_oracles"
path = "tests/protocol_oracles.rs"
# No `required-features`: the two models import no production code, so there is no feature that could
# make them fail to build, and a gate here would only hide them from a narrower command.

[[test]]
name = "publish_and_kick"
path = "tests/publish_and_kick.rs"
required-features = ["map", "tokio"]

[[test]]
name = "resource_transfer"
path = "tests/resource_transfer.rs"
# Both legs' old `notify` and `map` terms were vacuous: `process` already pulls in the mapping and
# notification layers, so this is everything the two files actually reach for.
required-features = ["process"]

[[test]]
name = "recovery_conserves"
path = "tests/recovery_conserves.rs"
# `process` already pulls in the mapping and notification layers, so this is the narrowest pair on which
# every leg builds: the arithmetic leg additionally waits on a runtime doorbell.
required-features = ["process", "tokio"]

[[test]]
name = "verification_layout"
path = "tests/verification_layout.rs"
# No `required-features`, as for `protocol_oracles`: this target reads the manifest and the integration tree
# as text and imports no production code, so there is no feature that could make it fail to build.

[[test]]
name = "shared_word_access"
path = "tests/shared_word_access.rs"
# No `required-features`, as for `verification_layout`: this target reads `src/` as text and imports no
# production code, so there is no feature that could make it fail to build.

[[test]]
name = "ipc-study"
path = "benches/ipc/study_tests.rs"
required-features = ["benchmark"]

[[example]]
name = "index"
path = "examples/index.rs"
required-features = ["os", "tokio"]

[[example]]
name = "compile_cache"
path = "examples/compile_cache.rs"
required-features = ["os", "tokio"]

[[example]]
name = "second_introduction"
path = "examples/second_introduction.rs"
required-features = ["os"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.bench]
opt-level = 3
debug = false
strip = true
lto = true
codegen-units = 1
