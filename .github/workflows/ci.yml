name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # `rust-toolchain.toml` is the only place a compiler version is written: rustup resolves the
      # channel from it after checkout, so a row here cannot drift from the pin the docs cite. The
      # line below records which compiler the rest of the job actually ran.
      - run: rustc -vV
      - run: rustup component add rustfmt clippy rust-docs
      - run: rustup target add i686-unknown-linux-gnu riscv32imac-unknown-none-elf aarch64-unknown-none
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --all-features --no-deps
      - run: cargo test --features os,tokio,tracing
      # The row above never compiles `benches/ipc/*` or an example, so a target gated on a feature
      # it does not ask for goes unnoticed until someone builds the whole matrix by hand.
      - run: cargo test --all-features --all-targets
      - name: the examples run as processes and assert on what they print
        shell: bash
        run: bash .github/scripts/ci-examples.sh linux
      # What each row says it needs, compiled at that width. `--all-features` hides this class twice over: a
      # library feature that calls a dependency feature it never declares builds because another feature turns
      # that dependency on, and a target whose `required-features` stop short of the code it holds builds for
      # the same reason. `tokio` belongs in the row because four rows ask it — without it `cargo check` reports
      # those four skipped and reports nothing else.
      - run: cargo check --tests --features os,tokio
      # The mapping layer at the width it names. `src/os/unix.rs` asks `nix` for `sysconf`, which sits in
      # nix's own `feature` sub-layer, and `map` declared only `fs` and `mman`: the library built because
      # `notify` and `process` reach `nix/poll`, which turns `feature` on for them. No row asked for `map`
      # alone, so that was true for as long as nobody looked.
      - run: cargo test -q --features map --lib
      - run: cargo check --no-default-features
      - run: cargo check --no-default-features --target i686-unknown-linux-gnu
      # `categories` names `no-std`, and the two rows above check that tree where `std` is merely switched
      # off: `cfg(unix)` is still true there, so anything the portable layers reach for that only a libc
      # supplies builds anyway. A target with neither `unix` nor `windows` is the arm where that cannot
      # happen, and so the only arm that compiles the replacement rule `src/os.rs` documents — a caller's
      # `Source` over bytes in its own image, a caller's `Notify`/`Wait` over its own doorbell — instead of
      # asserting it. `tests/portable_contracts/static_source.rs` writes exactly that `Source`, but as a
      # process that still has a libc under it. One width each, because the `REGION_ALIGN` arrangement and
      # every bound derived from `usize` answer differently at 32 bits.
      - run: cargo check --no-default-features --target riscv32imac-unknown-none-elf
      - run: cargo check --no-default-features --target aarch64-unknown-none
      # Those two rows compile the crate at a bare target; neither can compile what a bare port writes.
      # `probe/bare_port` is the row for that: a `#![no_std]` crate of its own, holding the `Source` over its
      # own image, the doorbell pair, and the const-constructed initial region image, and reaching `evering`
      # only through its published surface. It is not under `tests/` because an integration target links the
      # `std` harness and so builds at no `*-none-elf` target at all — the one configuration this asks about.
      # 32 bits is the width where a bound derived from `usize` can answer differently, and the rows above
      # cover the other; it stays a `check` and never a `test`, because a bare target has no harness, so all
      # this row can establish is that the image compiles there, not that anything ran.
      - run: cargo check --manifest-path probe/bare_port/Cargo.toml --target riscv32imac-unknown-none-elf
      - run: cargo package --list

  windows:
    runs-on: windows-latest
    # Raised from 15 for the example rows: they ask a second feature set, so the library and the three
    # example binaries are compiled again, and the slowest of them runs three processes across an exec.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # The same pin, and the same reason for naming it in the log. `rustfmt` and `clippy` are absent
      # here because no row on this arm invokes either; the doc gate asks for `rust-docs`.
      - run: rustc -vV
      - run: rustup component add rust-docs
      - run: cargo test --features os,tokio,tracing
      # The doc surface is gated on this arm too, not only on Linux. `Death::credited` is a Linux-only
      # entrance, so an intra-doc link that resolves in the linux job's docs is a broken link on the host
      # whose readers get no docs at all — and the rows above compile code, which cannot see a doc link.
      - name: the documented surface builds without warnings
        shell: bash
        run: RUSTDOCFLAGS='-D warnings' cargo doc --all-features --no-deps
      # The examples, on the arm whose code they take: the rendezvous here is a pipe name rather than a
      # descriptor number, and the death witness is written for Linux alone, so this host is the one that
      # would otherwise carry an unexecuted example. Both arms call the same owner of those assertions.
      - name: the examples run as processes
        shell: bash
        run: bash .github/scripts/ci-examples.sh windows
      # The same narrow compile as the linux job: the legs this host owns are the ones a wide row hides.
      - run: cargo check --tests --features os,tokio
      # And the same width the linux job asks for the mapping layer. Nothing on this arm was broken by that
      # nix gate, and removing one of the three `windows-sys` subfeatures `map` declares does not fire this
      # row either, so it is the symmetric guard rather than a scar: the only row that asks this host's
      # mapping source to build and run with nothing above it.
      - run: cargo test -q --features map --lib
      - run: cargo check --all-targets --all-features
