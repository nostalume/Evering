name: IPC study

on:
  workflow_dispatch:
    inputs:
      family:
        description: Registered study family
        required: true
        default: core-ipc

permissions:
  contents: read

concurrency:
  group: study-${{ github.ref }}
  cancel-in-progress: true

# A study's model legs are ordinary tests, and CI's `cargo test --all-features --all-targets` row
# builds and runs the `ipc-study` target, so nothing here repeats them. What is left needs a timing
# harness on a quiet machine, which is why this workflow stays manual.
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FAMILY: ${{ inputs.family }}
    steps:
      - uses: actions/checkout@v7
      - run: rustc -vV
      - name: Accept only a registered family name
        shell: bash
        run: '[[ "$FAMILY" =~ ^[A-Za-z0-9._-]+$ ]]'
      - run: mkdir -p artifacts
      - run: cargo bench --bench ipc --features benchmark -- smoke "$FAMILY" "artifacts/$FAMILY.jsonl"
      - run: cargo bench --bench ipc --features benchmark -- analyze "artifacts/$FAMILY.jsonl" > "artifacts/$FAMILY.md"
      - run: cargo bench --bench ipc --features benchmark,plot -- plot artifacts/plots "artifacts/$FAMILY.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: ipc-study-${{ env.FAMILY }}
          path: artifacts/
          retention-days: 14
