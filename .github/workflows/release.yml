name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version to verify
        required: true
        default: 0.1.0

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: publish
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-19
          components: rustfmt, clippy, rust-docs
      - name: Match candidate metadata
        shell: bash
        run: |
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)" = "${{ inputs.version }}"
          grep -qx 'publish = true' Cargo.toml
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --all-features --no-deps
      - run: cargo test --features os,tokio,tracing
      - run: cargo check --all-targets --all-features
      - run: cargo package --list
      - run: cargo package

# Publishing remains intentionally absent. After crates.io trusted-publisher
# registration, a separate reviewed change may add an OIDC publishing job.
