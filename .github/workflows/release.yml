name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version to verify
        required: true
        default: 0.1.0

permissions:
  contents: read

jobs:
  # Verification is the gate, not a subset of it written twice: a candidate that passes here has
  # passed the same rows a push to `main` passes, including the bare-target arms and the examples.
  gates:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  candidate:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: publish
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - run: rustc -vV
      - name: Match candidate metadata
        shell: bash
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)" = "$VERSION"
          grep -qx 'publish = true' Cargo.toml
      - run: cargo package

# Publishing remains intentionally absent. After crates.io trusted-publisher
# registration, a separate reviewed change may add an OIDC publishing job.
